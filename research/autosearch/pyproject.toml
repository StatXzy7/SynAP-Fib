[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synap-search"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["sfibai-b", "optuna==4.9.0", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../code/src"]
